<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identitas Tim</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #020617, #0f172a, #164e63);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            text-align: center;
        }

        h1 {
            font-size: 45px;
            color: #67e8f9;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 40px;
        }

        .members {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .card {
            width: 270px;
            padding: 30px 20px;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 20px;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: #22d3ee;
            box-shadow: 0 0 25px rgba(34, 211, 238, 0.3);
        }

        .icon {
            font-size: 55px;
        }

        .card h2 {
            color: #67e8f9;
            margin: 15px 0 8px;
        }

        .card p {
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        .card a {
            display: inline-block;
            padding: 12px 22px;
            background: #0891b2;
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        .card a:hover {
            background: #06b6d4;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>IDENTITAS TIM</h1>

        <p class="subtitle">
            Project Kolaborasi GitHub
        </p>

        <div class="members">

            <div class="card">
                <div class="icon">💻</div>
                <h2>Adi</h2>
                <p>Anggota 1</p>
                <a href="adi.html">Lihat Identitas</a>
            </div>

            <div class="card">
                <div class="icon">🎮</div>
                <h2>Axl</h2>
                <p>Anggota 2</p>
                <a href="axl.html">Lihat Identitas</a>
            </div>

            <div class="card">
                <div class="icon">⚽</div>
                <h2>Razak</h2>
                <p>Anggota 3</p>
                <a href="razak.html">Lihat Identitas</a>
            </div>

        </div>

    </div>

</body>
</html>
